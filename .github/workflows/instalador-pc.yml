name: Instalador do PC (Windows)

# Gera o AlertaRoblox-Setup.exe.
# - Manual: aba Actions > "Instalador do PC (Windows)" > Run workflow
#   (o .exe fica em "Artifacts" no fim da execucao)
# - Release: crie uma tag v1.0.0 (ou uma Release com essa tag) e o .exe
#   e anexado automaticamente na Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Versao
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") { $v = $env:GITHUB_REF_NAME.TrimStart("v") }
          else { $v = "1.0.$env:GITHUB_RUN_NUMBER" }
          "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Colocar a versao no programa
        shell: pwsh
        run: |
          $t = Get-Content pc/monitor.py -Raw -Encoding utf8
          if ($t -notmatch 'VERSAO = "dev"' -or $t -notmatch 'CODIGO = 0 ') { Write-Host "::error::VERSAO/CODIGO nao encontrados no monitor.py"; exit 1 }
          $t = $t.Replace('VERSAO = "dev"', "VERSAO = `"$env:APP_VERSION`"").Replace('CODIGO = 0 ', "CODIGO = $env:GITHUB_RUN_NUMBER ")
          [IO.File]::WriteAllText("pc/monitor.py", $t, [Text.UTF8Encoding]::new($false))

      - name: Colocar URL e chave do Supabase no monitor
        env:
          SB_URL: ${{ vars.SUPABASE_URL }}
          SB_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        shell: pwsh
        run: |
          if (-not $env:SB_URL -or -not $env:SB_KEY) {
            Write-Host "::warning::Defina as variaveis SUPABASE_URL e SUPABASE_ANON_KEY em Settings > Secrets and variables > Actions > Variables. Sem elas o instalador nao conecta na nuvem."
            exit 0
          }
          python -c "import os,io;p='pc/monitor.py';t=io.open(p,encoding='utf-8').read();t=t.replace('https://SEU-PROJETO.supabase.co',os.environ['SB_URL'].rstrip('/')).replace('SUA_ANON_KEY',os.environ['SB_KEY']);io.open(p,'w',encoding='utf-8').write(t)"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r pc/requirements.txt
      # Nuitka transforma o programa em codigo nativo (C). Antivirus confundem bem
      # menos com virus do que o PyInstaller (que era o motivo dos falsos positivos).
      - name: Instalar Nuitka
        run: pip install "nuitka>=2.6,<3" ordered-set zstandard

      - name: Cache do Nuitka (acelera os proximos builds)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('pc/requirements.txt') }}
          restore-keys: nuitka-${{ runner.os }}-

      - name: Compilar com Nuitka
        working-directory: pc
        shell: pwsh
        run: |
          $v = "$env:APP_VERSION.0"
          python -m nuitka --standalone --assume-yes-for-downloads --msvc=latest `
            --windows-console-mode=disable `
            --enable-plugin=tk-inter `
            --include-package=customtkinter --include-package-data=customtkinter `
            --include-package=rapidocr_onnxruntime --include-package-data=rapidocr_onnxruntime `
            --include-module=pystray._win32 `
            --include-data-files=instalador/icone.ico=icone.ico `
            --windows-icon-from-ico=instalador/icone.ico `
            --company-name=OctavioKonzen --product-name="Alerta Roblox" `
            --file-version=$v --product-version=$v `
            --file-description="Alerta Roblox - avisa no celular e no Discord" `
            --copyright=OctavioKonzen `
            --output-filename=AlertaRoblox.exe --output-dir=build `
            monitor.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item build\monitor.dist dist\AlertaRoblox
          Get-ChildItem dist\AlertaRoblox | Select-Object -First 15 Name

      # PC zerado pode nao ter o Visual C++ (o leitor de texto precisa dele).
      # Leva as DLLs junto com o programa (distribuicao permitida pela Microsoft).
      - name: Incluir DLLs do Visual C++
        shell: pwsh
        run: |
          $destino = "pc\dist\AlertaRoblox"
          foreach ($dll in "msvcp140.dll","msvcp140_1.dll","msvcp140_2.dll","vcruntime140.dll","vcruntime140_1.dll","concrt140.dll") {
            $origem = "C:\Windows\System32\$dll"
            if ((Test-Path $origem) -and -not (Test-Path "$destino\$dll")) {
              Copy-Item $origem $destino
              Write-Host "incluida: $dll"
            }
          }

      # O .exe nao tem janela preta: espera ele terminar e mostra o alerta.log
      - name: Autoteste do .exe (leitura de texto)
        working-directory: pc
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\AlertaRoblox\AlertaRoblox.exe" -ArgumentList "autoteste" -Wait -PassThru
          Get-Content "$env:APPDATA\AlertaRoblox\alerta.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Host "::error::Autoteste falhou (codigo $($p.ExitCode))"; exit 1 }

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar instalador
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" pc\instalador\AlertaRoblox.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: AlertaRoblox-Setup-${{ env.APP_VERSION }}
          path: saida/*.exe

      - name: Anexar na Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: saida/*.exe

      # Publica na Release "ultima" (download dos jogadores + atualizacao automatica)
      - name: Publicar para atualizacao automatica
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARQ=$(ls saida/*.exe | head -1)
          bash .github/publicar.sh pc "$APP_VERSION" "$GITHUB_RUN_NUMBER" "$ARQ" AlertaRoblox-Setup.exe
