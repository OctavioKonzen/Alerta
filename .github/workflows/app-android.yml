name: App Android (APK)

# Gera o AlertaRoblox.apk.
# - Manual: aba Actions > "App Android (APK)" > Run workflow
#   (o .apk fica em "Artifacts" no fim da execucao)
# - Release: ao publicar uma tag v1.0.0, o .apk e anexado na Release.
# Precisa do segredo ANDROID_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Conferir segredo da assinatura
        env:
          KSPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KSPASS" ]; then
            echo "::error::Crie o segredo ANDROID_KEYSTORE_PASSWORD em Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

      - name: Versao
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="1.0.$GITHUB_RUN_NUMBER"; fi
          echo "APP_VERSION=$V" >> $GITHUB_ENV
          node -e "const f='app/app.json',fs=require('fs');const j=JSON.parse(fs.readFileSync(f));j.expo.version='$V';j.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER);fs.writeFileSync(f,JSON.stringify(j,null,2))"

      - name: Instalar dependencias
        working-directory: app
        run: |
          npm install
          npx expo install --fix

      - name: Gerar projeto Android
        working-directory: app
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"

      - name: Compilar APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Assinar APK
        env:
          KSPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          mkdir -p saida
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks app/release.p12 --ks-type PKCS12 --ks-key-alias alerta \
            --ks-pass env:KSPASS --key-pass env:KSPASS \
            --out "saida/AlertaRoblox-$APP_VERSION.apk" \
            app/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify "saida/AlertaRoblox-$APP_VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AlertaRoblox-${{ env.APP_VERSION }}-apk
          path: saida/*.apk

      - name: Anexar na Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: saida/*.apk

      # Publica na Release "ultima" (download dos jogadores + atualizacao automatica)
      - name: Publicar para atualizacao automatica
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/publicar.sh app "$APP_VERSION" "$GITHUB_RUN_NUMBER" "saida/AlertaRoblox-$APP_VERSION.apk" AlertaRoblox.apk
